# ---------------------------------------------------------------------------
# DCA Trailing Bot - Configuration OPTIMISÉE
# Objectif: Battre le Buy & Hold avec un drawdown INFÉRIEUR
# Résultats validés:
# - BTC-USDC: +26.20% vs B&H, Drawdown -11.44% (vs -28.71% B&H)
# - ETH-USDC: +30.47% vs B&H, Drawdown -18.86% (vs -43.03% B&H)
# ---------------------------------------------------------------------------

# Mode d'exécution
mode: paper

# Configuration marché
market:
  product_id: BTC-USDC
  granularity: SIX_HOUR
  warmup_bars: 100        # 100 bougies (réduit de 500 pour ne pas sauter trop de données)

# Stratégie DCA + Trailing Stop
strategy:
  # Mode d'entrée
  entry_mode: dca_on_pullback
  
  # --- Configuration DCA (2 niveaux) ---
  dca_levels: 2              # 2 niveaux DCA (moins agressif)
  dca_percentage: 0.25       # 25% du capital initial par niveau (50% total)
  dca_delay_bars: 6          # 6 bougies (36 heures) entre niveaux
  dca_pullback_levels: [-5.0, -10.0]  # Pullbacks à -5% et -10% vs plus haut
  
  # --- Entrée initiale ---
  initial_entry_condition: pullback  # Entrée sur pullback vers EMA200
  breakout_lookback: 20
  
  # --- Filtre de tendance ---
  use_trend_filter: true      # ACTIVÉ pour éviter marchés baissiers
  trend_ema: 200              # EMA200 pour filtre de tendance long terme
  trend_slope_lookback: 20
  
  # --- Confirmation de tendance ---
  adx_period: 14
  adx_min: 20                # ADX minimum pour éviter les ranges

# Gestion du risque
risk:
  # Trailing stop serré pour limiter les pertes
  trailing_stop_percentage: 8.0  # 8% (serré)
  initial_stop_percentage: 8.0   # Stop initial
  
  # Take profit - DÉSACTIVÉ pour laisser courir les gains
  take_profit_r_multiple: null
  take_profit_percentage: null
  
  # Risk per trade
  risk_per_trade: 0.01
  max_position_pct: 0.50
  
  # Protections
  hard_max_loss_pct: 0.10
  daily_max_loss_pct: 0.05
  max_drawdown_pct: 0.25

# Exécution
execution:
  prefer_maker: true
  limit_offset_bps: 5.0
  order_timeout_sec: 45
  stop_exit_is_market: true
  cooldown_bars: 12              # 12 bougies SIX_HOUR = 3 jours (éviter réentrée trop rapide)
  poll_offset_sec: 20

# Paper trading
paper:
  starting_cash: 10000.0

# Notifications
notifications:
  enabled: false
  on_trades: true
  on_incidents: true

discord:
  enabled: true
  webhook_url: "https://discord.com/api/webhooks/1562138425484775436/NewDRS61a1VzY9C9F7TeWBUqLchYNnb96jCi1978STRnQvlfkaouQhZrAaihHAh_aZwU"
  send_trades: true
  send_backtest_results: true

# Logging
logging:
  level: INFO
  state_file: state/bot_state.json
  trades_csv: logs/trades.csv
  equity_csv: logs/equity.csv
